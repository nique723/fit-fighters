<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fit Fighters</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-root {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #touch-controls {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      #touch-controls.visible {
        display: block;
      }
      .touch-cluster {
        position: absolute;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }
      .touch-cluster.left {
        left: 16px;
      }
      .touch-cluster.right {
        right: 16px;
        flex-wrap: wrap;
        width: 280px;
        justify-content: flex-end;
      }
      .touch-btn {
        width: 84px;
        height: 84px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 16px;
        background: rgba(12, 16, 22, 0.72);
        color: #f3f4f6;
        font: 700 13px/1.1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-btn.active {
        background: rgba(214, 158, 46, 0.85);
        border-color: #f6e05e;
        color: #1a202c;
      }
      #debug-overlay {
        display: none;
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 30;
        background: rgba(8, 10, 14, 0.82);
        color: #c6f6d5;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 10px 12px;
        border: 1px solid rgba(72, 187, 120, 0.35);
        border-radius: 6px;
        min-width: 240px;
        pointer-events: none;
        white-space: pre;
      }
      #debug-overlay.visible {
        display: block;
      }
      #hint {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 25;
        color: rgba(237, 242, 247, 0.7);
        font: 600 11px/1.3 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="hint">A/D move · J jab · K cross · L body · Space slip · ` debug</div>
      <pre id="debug-overlay"></pre>
      <div id="touch-controls">
        <div class="touch-cluster left">
          <button type="button" class="touch-btn" data-action="left">Left</button>
          <button type="button" class="touch-btn" data-action="right">Right</button>
        </div>
        <div class="touch-cluster right">
          <button type="button" class="touch-btn" data-action="jab">Jab</button>
          <button type="button" class="touch-btn" data-action="cross">Cross</button>
          <button type="button" class="touch-btn" data-action="body">Body</button>
          <button type="button" class="touch-btn" data-action="slip">Slip</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
